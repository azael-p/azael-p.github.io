<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Página no encontrada</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,700&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; }
    .error-content h1 { font-family: var(--font-display); font-size: 6rem; font-weight: 800; color: var(--accent); margin-bottom: 1rem; }
    .error-content p { font-size: 1.25rem; color: var(--text-muted); margin-bottom: 2rem; }
    .error-content .cta { display: inline-flex; padding: 0.75rem 1.5rem; background-color: var(--accent); color: var(--accent-fg); border-radius: 8px; font-weight: 600; transition: opacity 0.3s; }
    .error-content .cta:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <main class="error-content container">
    <h1>404</h1>
    <p data-i18n="error_message">Esta página no existe</p>
    <a href="/" class="cta" data-i18n="error_home">Volver al inicio</a>
  </main>
  <script>
    const lang = localStorage.getItem("lang") || "es";
    const translations = {
      es: { error_message: "Esta página no existe", error_home: "Volver al inicio" },
      en: { error_message: "This page doesn't exist", error_home: "Go home" }
    };
    const html = document.documentElement;
    const theme = localStorage.getItem("theme") || "dark";
    html.setAttribute("data-theme", theme);
    html.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(el => {
      const key = el.getAttribute("data-i18n");
      if (translations[lang][key]) el.textContent = translations[lang][key];
    });
  </script>
</body>
</html>
